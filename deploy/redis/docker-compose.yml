version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: mgxs-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - redis-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-http:
    image: hiett/serverless-redis-http:latest
    container_name: mgxs-redis-http
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "127.0.0.1:8585:80"
    networks:
      - redis-net

networks:
  redis-net:
    driver: bridge

volumes:
  redis-data:
    driver: local
